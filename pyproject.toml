[project]
name = "deposition-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "onedep-lib>=0.1.0.dev1",
    "prefect>=3.0.0",
    "biopython>=1.87",
    "requests>=2.34.2",
    "pdbe-sifts>=1.0",
    "regex>=2026.7.19",
    "reportlab>=5.0.1",
    "pdbe-mmcif-validator>=0.1.97",
    "rdkit>=2026.9.1",
    "mysql-connector-python>=26.7.0",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
]

[project.scripts]
deposition-toolkit = "deposition_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deposition_toolkit.ledger" = ["alembic.ini", "migrations/script.py.mako"]
